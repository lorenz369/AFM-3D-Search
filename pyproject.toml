[project]
name = "afm-3d-search"
version = "0.1.0"
description = "3D Scene Understanding"
authors = [{ name = "Tim Cramer", email = "tim@cramer-dlg.de" }]
readme = "README.md"
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "numpy==1.26.1",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "trimesh",
    "clip @ git+https://github.com/openai/CLIP.git",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",   
    "pyyaml",
]

[tool.uv]
managed = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"