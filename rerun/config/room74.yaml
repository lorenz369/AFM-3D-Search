# Minimal default settings for Interactive Text Search
# ---------------------------------------------------

defaults:
  - server: remote
  - scripted_run: room74
  - _self_

# REQUIRED: directory containing featurised *.pt files          
pointcloud_dir: ../data/output/room_74/ # <-- override via CLI

# In base_config.yaml or interactive.yaml
# original_pointcloud: ../data/output/arkit_scenes/raw/Training

# Determine which .pt key/filename (without extension) to load.
file_type: clip

# Rerun recording saving options
rerun_save_enabled: true
rerun_save_path: "output_${interactive_search.outlier_method}_statistical_${interactive_search.use_statistical_outliers}_dino_${interactive_search.use_dino_filtering}.rrd"

rendering:
  point_size: 0.01
  create_mesh: false       
  
# Feature-to-colour mapping options
features:
  show_clip_features: false  # Set to true to show CLIP feature visualization

# Comparison and analysis options
comparison:
  show_all_methods_comparison: true  # Set to false to disable all outlier methods comparison

# Interactive semantic-search controls (1-to-1 with class kwargs)
interactive_search:
  outlier_method: "enhanced_adaptive" # enhanced_adaptive, iqr, percentile, z_score, adaptive, combined
  use_statistical_outliers: true # true, false
  use_dino_filtering: true # true, false
  grey_out_unmatched: true 
