# Preset for text-based semantic search
# Use CLIP features for text similarity search

# Self-contained configuration for text search
defaults:
  - _self_

# Required parameter - user must provide this
pointcloud_dir: /home/marco/Marco/AFM-3D-Search/data/ARKitScenes_fpt

# Optimized for text search
file_type: "42447230"

# Server settings
mode: "serve"
server:
  port: 9878

# Rendering settings
rendering:
  point_size: 0.01
  create_mesh: true
  mesh_method: "ball_pivoting"  # poisson, ball_pivoting, alpha_shape
  use_voxels: false
  alpha_value: 0.02  # smaller values = denser mesh (only used for alpha_shape)
  voxel_size: 0.05

# Feature settings - focus on CLIP only for text search
features:
  show_features: true
  feature_type: "clip"  # Only show CLIP features
  pca_method: "hsv"

# Enable highlighting for search results
highlighting:
  enable: true  # Show search results
  mode: "random_points"
  animate: false
  animation_duration: 30.0

# Text similarity settings with good defaults
text_similarity:
  query: "chair"  # Example query - override via CLI
  top_k: 200  # Show more results
  threshold: 0.25  # Lower threshold for more matches (was 0.25)
  clip_model_version: "ViT-B/32"  # Will be auto-detected based on features 

interactive_search:
  enable: false 