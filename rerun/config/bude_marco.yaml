# Minimal default settings for Interactive Text Search
# ---------------------------------------------------

defaults:
  - server: remote
  - scripted_run: "bude_marco"
  - _self_

# REQUIRED: directory containing featurised *.pt files          
pointcloud_dir: ../data/completed/bude_marco # <-- override via CLI

# In base_config.yaml or interactive.yaml
# original_pointcloud: ../data/output/arkit_scenes/raw/Training
file_type: clip
# Rerun recording saving options
rerun_save_enabled: false  # Set to true to save a .rrd recording
rerun_save_path: "bude_marco_skripted_run.rrd"  # Path to save the .rrd file

rendering:
  point_size: 0.01
  create_mesh: false       
  
# Feature-to-colour mapping options
features:
  show_features: true

# Interactive semantic-search controls (1-to-1 with class kwargs)
interactive_search:
  outlier_method: "adaptive"
  use_statistical_outliers: true
  use_dino_filtering: true
  grey_out_unmatched: true 
