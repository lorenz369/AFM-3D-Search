# Base configuration for Enhanced Featurized Pointcloud Visualization
# This file contains the default settings for all visualization parameters

defaults:
  - _self_

# Required parameter - user must provide this
pointcloud_dir: /home/marco/Marco/AFM-3D-Search/data/ARKitScenes_fpt

# File type to visualize (discovered automatically)
file_type: "42447230"

# Visualization mode
mode: "serve"  # serve, save, web

# Server configuration
server:
  port: 9881

# Rendering settings
rendering:
  point_size: 0.01
  create_mesh: true
  mesh_method: "alpha_shape"  # poisson, ball_pivoting, alpha_shape
  alpha_value: 0.01  # smaller values = denser mesh (only used for alpha_shape)
  use_voxels: false
  voxel_size: 0.05

# Feature visualization settings
features:
  show_features: true
  feature_type: "both"  # clip, dino, both
  pca_method: "hsv"     # rgb, hsv

# Highlighting settings
highlighting:
  enable: false
  mode: "random_points"  # random_points, spatial_clusters, tight_clusters, feature_based, voxel_highlights
  animate: false
  animation_duration: 30.0

# Text-based similarity search
text_similarity:
  query: null
  top_k: 100
  threshold: 0.3
  clip_model_version: "ViT-B/32"  # ViT-B/32, ViT-L/14 

interactive_search:
  enable: false 