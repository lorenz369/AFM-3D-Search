# Minimal default settings for Interactive Text Search
# ---------------------------------------------------

defaults:
  - _self_

# REQUIRED: directory containing featurised *.pt files          
pointcloud_dir: /home/marco/Marco/AFM-3D-Search/data/output/arkit_scenes/raw/featurized/ # <-- override via CLI

# In base_config.yaml or interactive.yaml
original_pointcloud: /home/marco/Marco/AFM-3D-Search/data/output/arkit_scenes/raw/Training

# Determine which .pt key/filename (without extension) to load.
file_type: "42447230"

rendering:
  point_size: 0.01
  create_mesh: true       
  
# Feature-to-colour mapping options
features:
  show_features: true
  feature_type: "both"     # clip, dino, both
  pca_method: "hsv"        # rgb, hsv

# Interactive semantic-search controls (1-to-1 with class kwargs)
interactive_search:
  outlier_method: "adaptive"
  use_statistical_outliers: true
  use_dino_filtering: true

# Network port for the local gRPC server (optional)
server:
  port: 9878 