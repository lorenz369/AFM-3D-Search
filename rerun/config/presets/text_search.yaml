# Preset for text-based semantic search
# Use CLIP features for text similarity search

# Inherit base settings
defaults:
  - ../base_config

# Optimized for text search
file_type: "clip"  # Use CLIP features specifically

# Server settings (keep defaults from base)
mode: "serve"

# Rendering optimized for highlighting
rendering:
  point_size: 0.012  # Slightly larger for better visibility
  create_mesh: false
  use_voxels: false

# Feature settings - focus on CLIP only for text search
features:
  show_features: true
  feature_type: "clip"  # Only show CLIP features
  pca_method: "hsv"

# Enable highlighting for search results
highlighting:
  enable: true  # Show search results
  mode: "random_points"
  animate: false

# Text similarity settings with good defaults
text_similarity:
  query: "chair"  # Example query - override via CLI
  top_k: 200
  threshold: 0.25  # Balanced threshold
  clip_model_version: "ViT-B/32" 