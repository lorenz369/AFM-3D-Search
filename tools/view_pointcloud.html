<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKit Path Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark gray background */
            color: #e5e7eb; /* Light gray text */
        }
        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(31, 41, 55, 0.8); /* Semi-transparent dark panel */
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        .file-upload-btn {
            background-color: #3b82f6;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }
        .file-upload-btn:hover {
            background-color: #2563eb;
        }
        input[type="file"] {
            display: none;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

        // --- Global Three.js variables ---
        let scene, camera, renderer, controls;
        const visualizationGroup = new THREE.Group(); // A group to hold all path-related objects

        /**
         * Parses the raw text data into an array of Three.js 4x4 matrices.
         * @param {string} data - The raw string data from the pose file.
         * @returns {THREE.Matrix4[]} An array of poses.
         */
        function parsePoses(data) {
            const poses = [];
            const lines = data.trim().split('\n');
            
            for (const line of lines) {
                if (line.startsWith('#') || line.trim() === '') continue;
                
                const parts = line.trim().split(/\s+/).map(Number);
                if (parts.length !== 13) continue;

                const values = parts.slice(1);
                
                const matrix = new THREE.Matrix4();
                matrix.set(
                    values[0], values[1], values[2],  values[3],
                    values[4], values[5], values[6],  values[7],
                    values[8], values[9], values[10], values[11],
                    0,         0,         0,          1
                );
                poses.push(matrix);
            }
            return poses;
        }

        /**
         * Clears the previous visualization from the scene.
         */
        function clearVisualization() {
            // Remove all children from the group
            while(visualizationGroup.children.length > 0){ 
                visualizationGroup.remove(visualizationGroup.children[0]); 
            }
        }

        /**
         * Draws the camera path and helpers for a given set of poses.
         * @param {THREE.Matrix4[]} poses - The array of poses to visualize.
         */
        function drawPath(poses) {
            clearVisualization();

            if (poses.length === 0) {
                console.warn("No poses to draw.");
                return;
            }

            // --- Create Path Geometry ---
            const points = poses.map(p => new THREE.Vector3().setFromMatrixPosition(p));
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
            const pathLine = new THREE.Line(lineGeometry, lineMaterial);
            visualizationGroup.add(pathLine);

            // --- Add Start/End Markers ---
            const startGeo = new THREE.SphereGeometry(0.02, 16, 16);
            const startMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const startMarker = new THREE.Mesh(startGeo, startMat);
            startMarker.position.copy(points[0]);
            visualizationGroup.add(startMarker);

            const endGeo = new THREE.SphereGeometry(0.02, 16, 16);
            const endMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const endMarker = new THREE.Mesh(endGeo, endMat);
            endMarker.position.copy(points[points.length - 1]);
            visualizationGroup.add(endMarker);

            // --- Add Camera Orientation Helpers ---
            const step = Math.max(1, Math.floor(poses.length / 50));
            for (let i = 0; i < poses.length; i += step) {
                const helper = new THREE.AxesHelper(0.1); // Use AxesHelper for better performance
                helper.position.setFromMatrixPosition(poses[i]);
                helper.quaternion.setFromRotationMatrix(poses[i]);
                visualizationGroup.add(helper);
            }
        }

        /**
         * Initializes the entire 3D scene and renders the first path.
         */
        function init() {
            // --- Scene Setup ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x444444));
            scene.add(visualizationGroup); // Add the main group to the scene

            // --- Camera Setup ---
            const container = document.getElementById('container');
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.01, 1000);
            camera.position.set(0.5, 0.5, 0.5);
            camera.lookAt(scene.position);

            // --- Renderer Setup ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // --- Controls ---
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('file-upload').addEventListener('change', handleFileSelect, false);

            // --- Initial Draw ---
            const initialPoses = parsePoses(initialPoseData);
            drawPath(initialPoses);

            // --- Animation Loop ---
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        /**
         * Handles the file upload event.
         * @param {Event} event - The file input change event.
         */
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name').textContent = `Visualizing: ${file.name}`;

            const reader = new FileReader();
            reader.onload = function(e) {
                const newPoseData = e.target.result;
                const newPoses = parsePoses(newPoseData);
                drawPath(newPoses);
            };
            reader.readAsText(file);
        }

        // Start the application
        init();

    </script>
